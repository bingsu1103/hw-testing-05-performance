name: performance-gate

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sut-performance-sensitive-change]

concurrency:
  group: performance-gate
  cancel-in-progress: false

jobs:
  load-gate:
    runs-on: [self-hosted, performance]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out performance assets
        uses: actions/checkout@v7

      - name: Check out the SUT
        uses: actions/checkout@v7
        with:
          repository: ttbhanh/eshop-sut
          path: sut

      - name: Verify runner prerequisites
        run: |
          java -version
          node --version
          jmeter --version
          python3 --version

      - name: Install backend dependencies
        run: npm ci --prefix sut/backend

      - name: Start isolated backend
        run: |
          npm start --prefix sut/backend > results/ci-backend.log 2>&1 &
          echo $! > results/ci-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/products > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run bounded load gate
        run: |
          jmeter -n \
            -t test-plans/23120205_Load_20261117.jmx \
            -Jthreads=10 -Jramp_seconds=30 -Jloops=3 \
            -Jcsv_file="$GITHUB_WORKSPACE/data/users.csv" \
            -l results/ci-load.jtl \
            -e -o reports/ci-load

      - name: Enforce error-rate gate
        run: python3 scripts/analyze_jtl.py results/ci-load.jtl --max-error-rate 1

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-evidence-${{ github.run_id }}
          path: |
            results/
            reports/ci-load/
          retention-days: 30

